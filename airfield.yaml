kind: package
name: ut_automata
dependencies:
- ament_index_cpp
- geometry_msgs
- std_msgs
- nav_msgs
- sensor_msgs
- tf2
- tf2_geometry_msgs
- tf2_ros
- amrl_msgs
- amrl_maps
- cv_bridge
- opencv2
- qt5
- glog
- gflags
- lua5.1
- boost
- libx11
- i2c
- mpu6050driver
# urg_node: Hokuyo lidar driver launched by hokuyo_10lx.launch.py
# (Node package='urg_node'). Not linked by ut_automata code, but must be
# installed in the image so the launch can find it. apt: ros-$ROS_DISTRO-urg-node.
- urg_node
# camera_calibration: the cameracalibrator tool run by the camera_calibration
# plan (ros2 run camera_calibration cameracalibrator ...). Not linked by
# ut_automata code, but the plan runs it in this container, so it must be
# installed in the image. apt: ros-$ROS_DISTRO-camera-calibration.
- camera_calibration
- rosidl_default_runtime
- ament_cmake
- rosidl_default_generators
source_path: .
ros_distro: jazzy
# The auto colcon build (container entry wrapper) must pass Hardware mode:
# CMakeLists gates vesc_driver behind IF(CMAKE_BUILD_MODE MATCHES "Hardware");
# without it the driver is never compiled -> "No executable found".
colcon_args: --cmake-args -DCMAKE_BUILD_MODE=Hardware
# Hardware access for vesc_driver (VESC serial + MPU6050 IMU) and joystick.
# /dev/ttyACM0 is root:dialout -> needs dialout group (GID 20) to open it;
# /dev/i2c-7 is root:i2c -> needs i2c group (GID 108) for the MPU6050 IMU
# (vesc.lua i2c_bus_number=7), else "failed to open /dev/i2c-7" + IMU fusion off;
# /dev/input (whole dir, not just js0): the ILITEK touchscreen permanently
# owns js0, so a game controller enumerates as js1+ — passing only js0 hides
# the real controller. Docker maps every node present at container START;
# there is no hotplug, so the controller must be on before the plan comes up.
# /dev/input/js* is root:input -> GID 996.
devices:
  - /dev/ttyACM0
  - /dev/i2c-7
  - /dev/input
group_add:
  - "20"
  - "108"
  - "996"
